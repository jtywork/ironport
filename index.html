<html lang="en"><head><meta charset="utf-8">

<title>Ironport</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#d9d1bb;--paper:#ece4cc;--ink:#2b2219;--soft:#6b5a45;--rule:#b9ad8f;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15130f;--paper:#221e18;--ink:#e8dec6;--soft:#b3a386;--rule:#4a4234;}}
:root[data-theme="dark"]{--bg:#15130f;--paper:#221e18;--ink:#e8dec6;--soft:#b3a386;--rule:#4a4234;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IM Fell English",Georgia,serif;line-height:1.5}
main{max-width:1180px;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:2.3rem;letter-spacing:.08em;margin:0}
h3{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:1.5rem;letter-spacing:.06em;margin:2rem 0 .8rem;border-bottom:1px solid var(--rule);padding-bottom:.3rem}
.lede{margin:.2rem 0 .5rem;color:var(--soft);font-style:italic;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{background:var(--paper);border:1px solid var(--rule);padding:.9rem}
.card h2{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:1.15rem;letter-spacing:.05em;margin:0 0 .6rem}
.card h2 span{font-family:"IM Fell English",Georgia,serif;font-style:italic;font-size:.92rem;color:var(--soft);letter-spacing:0;margin-left:.3rem}
.art{background:#fbfaf6;border:1px solid var(--rule);display:flex;justify-content:center;padding:.5rem}
.art svg,.art img{width:100%;height:auto;display:block}
.art.wax{background:#efe6d0}
.card p{margin:.6rem 0 0;font-size:.95rem}
main.doc{max-width:900px}
.doc h1{margin-bottom:.5rem}.doc h2{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;letter-spacing:.06em;border-bottom:1px solid var(--rule);padding-bottom:.25rem;margin-top:2rem}
.doc h3,.doc h4{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;letter-spacing:.05em}
.doc table{border-collapse:collapse;width:100%;font-size:.95rem;display:block;overflow-x:auto}
.doc th,.doc td{border-bottom:1px solid var(--rule);padding:.35rem .6rem;text-align:left;vertical-align:top}
.doc blockquote{margin:0;padding:.2rem 1rem;border-left:3px solid var(--rule);color:var(--soft)}
a{color:inherit}
.toc{list-style:none;padding:0;margin:1.5rem 0}.toc li{background:var(--paper);border:1px solid var(--rule);padding:1rem 1.1rem;margin-bottom:.8rem}.toc a{font-family:"IM Fell English SC",Georgia,serif;font-size:1.35rem;letter-spacing:.05em;display:block;text-decoration:none}.toc span{color:var(--soft);font-style:italic}
</style></head><body><main class="doc">
